[program:wa-bridge]
command=/usr/bin/node index.js
directory=/app/wa-bridge
environment=PUPPETEER_SKIP_DOWNLOAD="true",PUPPETEER_EXECUTABLE_PATH="/usr/bin/chromium",WA_BRIDGE_PORT="3100",WA_BACKEND_URL="http://localhost:9001",WA_BRIDGE_SECRET="nelson-bridge-secret-b57c9a",WA_MEDIA_DIR="/app/backend/uploads/wa",NODE_ENV="production"
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/var/log/supervisor/wa-bridge.out.log
stderr_logfile=/var/log/supervisor/wa-bridge.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
user=root
